<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="online-orders.css">
    <title>Cozy Nest Cafe</title>
</head>
<body>
   <h1>Online Orders</h1>
   <input type="txt" placeholder="Enter Name"/>
   <input type="txt" placeholder="Enter Phone Number"/>

   <div>
       <h2>Menu</h2>
       <h3> Special Drinks</h3>
       <button> Nutella Cappuccino </button>
       <button> Iced banana-date latte </button>
       <button> Frappe </button>
       <button> Cream latte </button>

       <h3> Sandwhiches </h3>
       <button> Mozarella-tomato-basil </button>
       <button> Turkey Cheese </button>
       <button> Turkey Cheese Avocado </button>

       <h3> Sweet Treats </h3>
       <button> Croissant </button>
       <button> Cookies </button>
       <button> Muffin </button>
       <button> Banana Loaf </button>

       <h3> Smoothies </h3>
       <button> Banana </button>
       <button> Mango </button>
       <button> Strawberry </button>
   </div> 

   <div class="checkout">
       <P>Tax 4%</P>
       <p> Total amount: $$$ </p>    
   </div>
   
   <h2> Payment </h2>
   <div class="payment">
      <input type="txt" placeholder="Enter Pin # "/> 
      <button> Pay Now </button>
   </div>

</body>
</html>
